spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8001

jwt:
  secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LTMyYg==}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

services:
  auth:
    url: ${AUTH_SERVICE_URL:lb://auth-service}
  user:
    url: ${USER_SERVICE_URL:lb://user-service}
  catalog:
    url: ${CATALOG_SERVICE_URL:lb://catalog-service}
  search:
    url: ${SEARCH_SERVICE_URL:lb://search-service}
  cart:
    url: ${CART_SERVICE_URL:lb://cart-service}
  order:
    url: ${ORDER_SERVICE_URL:lb://order-service}
  payment:
    url: ${PAYMENT_SERVICE_URL:lb://payment-service}
  analytics:
    url: ${ANALYTICS_SERVICE_URL:lb://analytics-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.autohubstore.gateway: INFO
    org.springframework.cloud.gateway: WARN
