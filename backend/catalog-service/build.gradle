plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'jacoco'
}

group = 'com.autohubstore'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext {
    set('mapstructVersion', "1.6.3")
    set('lombokVersion', "1.18.38")
    set('lombokMapstructBindingVersion', "0.2.0")
    set('springdocVersion', "3.1.0")
    set('testcontainersVersion', "2.0.3")
    set('cucumberVersion', "7.33.0")
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = rootProject.file('../../infra/checkstyle/checkstyle.xml')
    ignoreFailures = false
    showViolations = true
    sourceSets = [sourceSets.main, sourceSets.test]
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation('org.springframework.kafka:spring-kafka') {
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
    }
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'io.minio:minio:9.0.1'
    implementation 'org.xerial.snappy:snappy-java:1.1.10.8'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation('org.springframework.kafka:spring-kafka-test') {
        exclude group: 'org.xerial.snappy', module: 'snappy-java'
    }
    testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.testcontainers:testcontainers-minio'
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-spring:${cucumberVersion}"
    testImplementation 'org.junit.platform:junit-platform-suite'
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

dependencyManagement {
    dependencies {
        dependency 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
        dependency 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
        dependency 'commons-beanutils:commons-beanutils:1.11.0'
        dependency 'at.yawk.lz4:lz4-java:1.11.1'
        dependency 'org.codehaus.plexus:plexus-utils:4.0.3'
        dependency 'org.scala-lang:scala-library:2.13.9'
        dependency 'org.apache.commons:commons-compress:1.28.0'
        dependency 'com.fasterxml.jackson.core:jackson-databind:2.21.6'
        dependency 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.6'
        dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.6'
        dependency 'tools.jackson.core:jackson-databind:3.1.6'
        dependency 'com.github.luben:zstd-jni:1.5.7-14'
        dependency 'org.bouncycastle:bcprov-jdk18on:1.85'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = new BigDecimal("0.70")
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

bootJar {
    archiveFileName = 'catalog-service.jar'
}
