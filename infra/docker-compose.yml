services:

    postgres-auth:
        image: postgres:16
        container_name: postgres-auth
        environment:
            POSTGRES_DB: auth_db
            POSTGRES_USER: auth_user
            POSTGRES_PASSWORD: auth_pass
        ports:
            - "5432:5432"
        volumes:
            - postgres_auth_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U auth_user -d auth_db" ]
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-user:
        image: postgres:16
        container_name: postgres-user
        environment:
            POSTGRES_DB: user_db
            POSTGRES_USER: user_user
            POSTGRES_PASSWORD: user_pass
        ports:
            - "5433:5432"
        volumes:
            - postgres_user_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U user_user -d user_db" ]
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-catalog:
        image: postgres:16
        container_name: postgres-catalog
        environment:
            POSTGRES_DB: catalog_db
            POSTGRES_USER: catalog_user
            POSTGRES_PASSWORD: catalog_pass
        ports:
            - "5434:5432"
        volumes:
            - postgres_catalog_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U catalog_user -d catalog_db" ]
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-order:
        image: postgres:16
        container_name: postgres-order
        environment:
            POSTGRES_DB: order_db
            POSTGRES_USER: order_user
            POSTGRES_PASSWORD: order_pass
        ports:
            - "5435:5432"
        volumes:
            - postgres_order_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U order_user -d order_db" ]
            interval: 10s
            timeout: 5s
            retries: 5

    postgres-payment:
        image: postgres:16
        container_name: postgres-payment
        environment:
            POSTGRES_DB: payment_db
            POSTGRES_USER: payment_user
            POSTGRES_PASSWORD: payment_pass
        ports:
            - "5436:5432"
        volumes:
            - postgres_payment_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U payment_user -d payment_db" ]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

    zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        container_name: zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - "2181:2181"
        volumes:
            - zookeeper_data:/var/lib/zookeeper/data
            - zookeeper_log:/var/lib/zookeeper/log

    kafka:
        image: confluentinc/cp-kafka:7.6.0
        container_name: kafka
        depends_on:
            - zookeeper
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volumes:
            - kafka_data:/var/lib/kafka/data
        healthcheck:
            test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
            interval: 15s
            timeout: 10s
            retries: 5

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
        container_name: elasticsearch
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        ports:
            - "9200:9200"
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        healthcheck:
            test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'" ]
            interval: 20s
            timeout: 10s
            retries: 10

    kibana:
        image: docker.elastic.co/kibana/kibana:8.13.0
        container_name: kibana
        depends_on:
            - elasticsearch
        ports:
            - "5601:5601"
        environment:
            ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    cassandra:
        image: cassandra:4.1
        container_name: cassandra
        ports:
            - "9042:9042"
        volumes:
            - cassandra_data:/var/lib/cassandra
        environment:
            CASSANDRA_CLUSTER_NAME: autohub-cluster
            CASSANDRA_DC: datacenter1
        healthcheck:
            test: [ "CMD-SHELL", "nodetool status | grep UN" ]
            interval: 30s
            timeout: 10s
            retries: 10

    prometheus:
        image: prom/prometheus:v2.51.0
        container_name: prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"

    grafana:
        image: grafana/grafana:10.4.0
        container_name: grafana
        depends_on:
            - prometheus
        ports:
            - "3011:3000"
        environment:
            GF_SECURITY_ADMIN_PASSWORD: admin
        volumes:
            - grafana_data:/var/lib/grafana

    jaeger:
        image: jaegertracing/all-in-one:1.56
        container_name: jaeger
        ports:
            - "16686:16686"
            - "4317:4317"
            - "4318:4318"
        environment:
            COLLECTOR_OTLP_ENABLED: "true"

    mailhog:
        image: mailhog/mailhog:v1.0.1
        container_name: mailhog
        ports:
            - "1025:1025"
            - "8025:8025"

volumes:
    postgres_auth_data:
    postgres_user_data:
    postgres_catalog_data:
    postgres_order_data:
    postgres_payment_data:
    redis_data:
    zookeeper_data:
    zookeeper_log:
    kafka_data:
    elasticsearch_data:
    cassandra_data:
    prometheus_data:
    grafana_data:
